name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Menginstal Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- TAMBAHKAN LANGKAH LINTER FLAKE8 DI SINI ---
      - name: Jalankan Linter Flake8
        run: |
          flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Jalankan Automated Unit Testing
        run: |
          python -m pytest -v
